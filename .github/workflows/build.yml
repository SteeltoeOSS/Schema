name: build-and-test
on:
  workflow_dispatch:
  push:
    branches:
    - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          10.0.*

    - name: Git checkout Schema
      uses: actions/checkout@v7
      with:
        path: Schema
        persist-credentials: false

    - name: Git checkout Steeltoe
      uses: actions/checkout@v7
      with:
        repository: SteeltoeOSS/Steeltoe
        path: Steeltoe
        ref: main
        persist-credentials: false

    - name: Restore packages
      run: |
        dotnet restore Schema

    - name: Build solution
      run: |
        dotnet build Schema --no-restore --configuration Release

    - name: Test
      run: |
        dotnet test Schema --no-build --configuration Release
